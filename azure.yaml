name: events-app
metadata:
  template: ""

services:
  function:
    project: ./functions
    language: ts
    host: function
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: npm install; npm run build
        posix:
          shell: sh
          run: npm install && npm run build

hooks:
  postprovision:
    windows:
      shell: pwsh
      run: ./infra/hooks/postprovision.ps1
      interactive: false
      continueOnError: false
    linux:
      shell: pwsh
      run: ./infra/hooks/postprovision.ps1
      interactive: false
      continueOnError: false
  postdeploy:
    windows:
      shell: pwsh
      run: ./infra/hooks/postdeploy.ps1
      interactive: false
      continueOnError: false
    linux:
      shell: pwsh
      run: ./infra/hooks/postdeploy.ps1
      interactive: false
      continueOnError: false
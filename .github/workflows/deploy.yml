name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and lint web
        working-directory: ./web
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Build and typecheck functions
        working-directory: ./functions
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Docker build check (web only)
        run: docker build -t events-web-test ./web

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Provision infrastructure
        run: azd provision --auth-type azurecli --no-prompt
        env:
          AZURE_ENV_NAME: mvp

      - name: Deploy functions
        run: azd deploy --auth-type azurecli --no-prompt
        env:
          AZURE_ENV_NAME: mvp

      - name: Get azd outputs
        id: env
        run: |
          echo "rg=$(azd env get-value AZURE_RESOURCE_GROUP)" >> $GITHUB_OUTPUT
          echo "acrServer=$(azd env get-value acrLoginServer)" >> $GITHUB_OUTPUT
          echo "funcApp=$(azd env get-value functionAppName)" >> $GITHUB_OUTPUT
          echo "containerApp=$(azd env get-value containerAppName)" >> $GITHUB_OUTPUT

      - name: Get function key
        id: function-key
        env:
          FUNC_APP: ${{ steps.env.outputs.funcApp }}
          RG: ${{ steps.env.outputs.rg }}
        run: |
          key=$(az functionapp keys list \
            --name "$FUNC_APP" \
            --resource-group "$RG" \
            --query functionKeys.default -o tsv)
          echo "::add-mask::$key"
          echo "functionKey=$key" >> $GITHUB_ENV
          echo "functionKey=$key" >> $GITHUB_OUTPUT

      - name: Build and push web Docker image
        run: |
          ACR_SERVER="${{ steps.env.outputs.acrServer }}"
          ACR_NAME="${ACR_SERVER%%.*}"
          az acr login --name "$ACR_NAME"
          IMAGE_TAG="${ACR_SERVER}/events-web:${{ github.sha }}"
          docker build \
            -t "$IMAGE_TAG" \
            -t "${ACR_SERVER}/events-web:latest" \
            ./web
          docker push "${ACR_SERVER}/events-web" --all-tags

      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ steps.env.outputs.containerApp }}" \
            --resource-group "${{ steps.env.outputs.rg }}" \
            --image "${{ steps.env.outputs.acrServer }}/events-web:${{ github.sha }}" \
            --secrets "function-key=${{ steps.function-key.outputs.functionKey }}" \
            --output none
